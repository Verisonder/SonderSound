name: Test APK

on:
  push:
    branches: ['test/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the signing key
        shell: bash
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -z "$RELEASE_KEYSTORE" ]; then
            echo "::error::RELEASE_KEYSTORE is not set. Nothing can be signed."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        shell: bash
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Publish to the artifacts repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_PAT }}
        run: |
          SLUG=$(echo "${GITHUB_REF_NAME#test/}" | tr '/' '-')
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK was produced."
            exit 1
          fi
          cp "$APK" "SonderSound-$SLUG.apk"
          gh release delete "test-$SLUG" --repo Verisonder/vs-artifacts --yes --cleanup-tag || true
          gh release create "test-$SLUG" "SonderSound-$SLUG.apk" \
            --repo Verisonder/vs-artifacts \
            --title "SonderSound $SLUG" \
            --notes "Test build from $GITHUB_REF_NAME at $GITHUB_SHA"

      - name: Report the failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_PAT }}
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # CI logs are not fetchable from the assistant's container, so the error is
          # written where the API can read it rather than being guessed at.
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ARTIFACTS_PAT is not set, so the failure was not reported."
            exit 0
          fi
          gradle --no-daemon assembleRelease > out.txt 2>&1 || true
          SHA=$(gh api repos/Verisonder/vs-artifacts/contents/failures/latest.txt --jq .sha 2>/dev/null || true)
          gh api -X PUT repos/Verisonder/vs-artifacts/contents/failures/latest.txt \
            -f message="SonderSound release build failure on $GITHUB_REF_NAME" \
            -f content="$(base64 -w0 out.txt)" \
            ${SHA:+-f sha="$SHA"}
